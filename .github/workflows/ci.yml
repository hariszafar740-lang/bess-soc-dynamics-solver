name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest + ruff + wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77.0" wheel build
          pip install --no-build-isolation -e ".[dev]"

      - name: Install independent PyBaMM validation reference (Python 3.11 & 3.12)
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12'
        run: pip install -r requirements-validation.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: python -m pytest -v

      - name: Verify CLI entrypoint & wheel layout
        run: |
          bess-sim info --json
          python -m bess_solver info
          python -m build --no-isolation
          python - << 'PY'
          import glob
          import zipfile

          whls = glob.glob("dist/*.whl")
          assert len(whls) == 1, whls
          names = zipfile.ZipFile(whls[0]).namelist()
          assert "bess_solver/__init__.py" in names
          assert "bess_solver/py.typed" in names
          assert not any(n.startswith("src/") for n in names), names
          PY
          rm -rf dist build

      - name: Smoke-run main benchmark & artifact generation
        run: python main.py
